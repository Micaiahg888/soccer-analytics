<!DOCTYPE html>
<html>

<body>

<h1>Add Player Performance</h1>

<form method="POST" action="/add_stat">

    <h3>Player</h3>
    <select name="player_id">
        {% for player in players %}
        <option value="{{ player.id }}">
            {{ player.name }}
        </option>
        {% endfor %}
    </select>

    <h3>Match</h3>
    <select name="match_id">
        {% for match in matches %}
        <option value="{{ match.id }}">
            {{ match.opponent }} - {{ match.date }}
        </option>
        {% endfor %}
    </select>

    <input type="number" name="goals" placeholder="Goals">
    <input type="number" name="assists" placeholder="Assists">
    <input type="number" name="minutes" placeholder="Minutes">

    <button type="submit">Save Performance</button>

</form>

</body>
</html>
